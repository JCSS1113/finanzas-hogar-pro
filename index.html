<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Gastos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Asistente de Gastos</h1>
            <p>Tu ayudante inteligente para registrar gastos</p>
        </header>

        <div class="chat-container">
            <div id="chat" class="chat"></div>
            
            <div class="input-area">
                <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display: none;">
                <button class="btn-foto" onclick="document.getElementById('fotoInput').click()">
                    Tomar Foto
                </button>
                <input type="text" id="mensaje" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
                <button class="btn-enviar" onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
