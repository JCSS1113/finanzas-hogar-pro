<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Tickets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Scanner de Tickets</h1>
            <p>Toma una foto y extrae los productos</p>
        </header>

        <div class="card">
            <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display: none;">
            <button class="btn-camara" onclick="document.getElementById('fotoInput').click()">
                Tomar Foto
            </button>
            
            <div id="preview"></div>
            
            <div id="progreso" style="display: none;">
                <p id="progresoTexto">Procesando...</p>
                <div class="barra-progreso">
                    <div id="barra"></div>
                </div>
            </div>
        </div>

        <div class="card" id="resultados" style="display: none;">
            <h2>Productos Detectados</h2>
            <table class="tabla-productos">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="listaProductos"></tbody>
            </table>
            <div id="total"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
